<!doctype html><html lang="ar" dir="rtl" class="lang-ar"><head><meta charset="utf-8">
<link rel="stylesheet" href="/build/assets/app-DRGGbqxK.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head><body class="bg-surface p-8">
<div x-data="{ payOpen: true }">
  <div x-show="payOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4">

    <div x-show="payOpen" @keydown.escape.window="payOpen = false" role="dialog" aria-modal="true"
      class="relative z-10 w-full max-w-md overflow-hidden rounded-3xl bg-surface-container-lowest shadow-2xl">
      <button id="x" type="button" @click="payOpen = false"
        class="absolute top-3 z-10 flex h-9 w-9 items-center justify-center rounded-full text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-error end-4"
        aria-label="إغلاق" title="إغلاق">
        <span class="material-symbols-outlined !text-xl">close</span>
      </button>
      <h3 id="title" class="border-b border-outline-variant/60 py-4 ps-6 pe-14 font-headline-md text-headline-md">صرف راتب أحمد البركة الطويل جدا</h3>
      <div class="p-6">body</div>
    </div>
  </div>
</div>
</body></html>
