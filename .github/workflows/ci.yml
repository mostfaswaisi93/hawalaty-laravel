name: CI

# Everything this repository relies on to stay correct runs here, because a
# guard nobody runs is not a guard. The suite includes several that exist
# specifically to catch defects which render perfectly and pass every other
# check - a missing translation key, a <label> naming nothing, a write route
# with no permission check, an N+1. Those only bind if they run on every push.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Tenant tests need a REAL MySQL server: database/migrations/tenant uses
      # MySQL-only DDL and cannot run on sqlite. TenantTestCase creates its own
      # `hawalaty_testing_tenant` database on first use, so only the server has
      # to exist here. The platform half of the suite stays on sqlite.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # bcmath is REQUIRED, not optional: the box-balance guard and the
          # settlement reconciliation compare money as decimal STRINGS, never
          # floats. Without it those four call sites fatal at runtime.
          extensions: mbstring, pdo_mysql, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Before the tests: TranslationFilesTest scans the SOURCE, but a build
      # failure would ship a broken page that no PHP test can see.
      - name: Build front-end assets
        run: npm run build

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 --silent && exit 0
            sleep 2
          done
          echo "MySQL never became available" && exit 1

      # TenantTestCase reads these to find the MySQL server (and only the
      # server - it owns the test database name itself). They used to be
      # hardcoded there, so this block was decorative and the suite only ran on
      # a machine whose root had no password.
      - name: Run the test suite
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: ''
